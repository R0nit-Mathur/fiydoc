version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiydoc-postgres
    environment:
      POSTGRES_USER: fiydoc_user
      POSTGRES_PASSWORD: fiydoc_password
      POSTGRES_DB: fiydoc_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u fiydoc_user -d fiydoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
