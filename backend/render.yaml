services:
  - type: web
    name: fiydoc-backend
    runtime: node
    plan: free
    region: singapore
    # Builds must not mutate the production schema. Future migrations require a
    # reviewed migration, database backup and an explicit deployment step.
    buildCommand: "pnpm install --frozen-lockfile && pnpm run build"
    startCommand: "pnpm run start:prod"
    healthCheckPath: "/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
